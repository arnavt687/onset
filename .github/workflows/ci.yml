# Offline tests for every piece: no keys, no secrets, no network tests (ONSET_NETWORK_TESTS unset).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONSET_MODELS: ${{ github.workspace }}/models
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # MediaPipe's native library loads EGL/GLES even for CPU inference.
      - name: Install system libraries for MediaPipe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # The same two models (and URLs) as tools/setup-shared.sh.
      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: models
          key: mediapipe-models-float16-latest-v1

      - name: Download MediaPipe models
        run: |
          mkdir -p models
          fetch() { [ -s "models/$1" ] || curl -fsSL --retry 3 -o "models/$1" "$2"; }
          fetch face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          fetch pose_landmarker_full.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
          ls -la models

      # Only tests/: pytest's default discovery also matches tools/*_test.py, and
      # tools/tts_test.py synthesizes speech with real keys when imported.
      - name: pytest
        run: python -m pytest -q tests
